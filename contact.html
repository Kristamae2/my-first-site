<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krista Sotero - Contact Us</title>
    <style>
        :root {
            --primary-pink: #f8d7da;
            --accent-pink: #f2a6b2;
            --dark-text: #4a2c2a;
            --white: #ffffff;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-pink);
            color: var(--dark-text);
        }
        header {
            background-color: var(--white);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-pink);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
        }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: var(--dark-text);
            font-weight: 500;
        }
        nav a:hover {
            color: var(--accent-pink);
        }
        .hero {
            background-color: var(--accent-pink);
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--accent-pink);
            border-radius: 5px;
            font-family: inherit;
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent-pink);
            color: var(--dark-text);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e0939f;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--accent-pink);
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Krista Sotero</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="ethics.html">Ethics & Attribution</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Contact Us</h1>
        <p>Have any questions or messages? Send them using the form below.</p>
    </div>

    <div class="container">
        <form>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <footer>
        &copy; 2026 Krista Sotero. All rights reserved.
    </footer>

</body>
</html>
